<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>運動分帳</title>
    <link rel="icon" href="assets/sports-hero.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="summary-band">
        <div>
          <h1>運動要付錢</h1>
        </div>
      </section>

      <nav class="section-tabs" aria-label="功能分區">
        <button class="tab-button active" type="button" data-view="settlementView"><span aria-hidden="true">💸</span> 誰要付錢</button>
        <button class="tab-button" type="button" data-view="eventsView">場次紀錄</button>
        <button class="tab-button" type="button" data-view="peopleView">人員設定</button>
      </nav>

      <section class="view-panel active" id="settlementView">
        <section class="panel settlement-panel">
          <div class="panel-header">
            <div>
              <p class="section-kicker">誰要付錢</p>
              <h2>最後需要轉帳</h2>
            </div>
            <span class="pill" id="settlementCount">0 筆</span>
          </div>
          <p class="settlement-note">付款金額僅結算至今日已完成運動的場次</p>
          <div id="settlementList" class="settlement-list"></div>
          <div class="settlement-summary">
            <article>
              <span>尚未結清</span>
              <strong id="openTransfers">0</strong>
            </article>
            <article>
              <span>待轉帳金額</span>
              <strong id="openAmount">$0</strong>
            </article>
          </div>
        </section>
      </section>

      <section class="view-panel" id="eventsView">
        <div class="events-grid">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="section-kicker">新增場次</p>
                <h2>記一場運動</h2>
              </div>
            </div>
            <form id="eventForm" class="compact-event-form">
              <div class="event-fields-row">
                <label>
                日期
                <input name="date" type="date" required />
                </label>
                <label>
                開始時間
                <select name="startTime" required></select>
                </label>
                <label>
                結束時間
                <select name="endTime" required></select>
                </label>
                <label>
                項目
                <input name="sport" list="sportOptions" placeholder="匹克球" required />
                <datalist id="sportOptions"></datalist>
                </label>
                <label>
                費用總計
                <input name="total" type="number" min="0" step="1" placeholder="2000" required />
                </label>
                <label>
                付款人
                <select name="payer" required></select>
                </label>
              </div>
              <div class="wide">
                <div class="row-title">參加者與付款狀態</div>
                <div id="participantPicker" class="participant-picker"></div>
              </div>
              <button class="primary-button wide" type="submit">新增場次</button>
            </form>
          </section>

          <section class="panel history-panel">
            <div class="panel-header history-header">
              <div>
                <p class="section-kicker">歷史紀錄</p>
                <h2>所有場次</h2>
              </div>
              <select id="sportFilter" aria-label="篩選項目">
                <option value="all">全部項目</option>
              </select>
            </div>
            <div id="historyList" class="history-list"></div>
          </section>
        </div>
      </section>

      <section class="view-panel" id="peopleView">
        <section class="panel">
          <div class="panel-header">
            <div>
              <p class="section-kicker">人員設定</p>
              <h2>人員設定</h2>
            </div>
          </div>
          <form id="personForm" class="inline-form">
            <input name="name" placeholder="輸入姓名" required />
            <button class="primary-button" type="submit">新增</button>
          </form>
          <div id="peopleList" class="people-list"></div>
        </section>
      </section>
    </main>

    <template id="participantTemplate">
      <div class="participant-row">
        <label class="check-label">
          <input type="checkbox" class="participant-check" />
          <span></span>
        </label>
        <select class="participant-status">
          <option value="unpaid" selected>未付款</option>
          <option value="paid">已付款</option>
        </select>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
